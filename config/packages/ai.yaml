ai:
    platform:
        lmstudio:
            host_url: '%env(LM_STUDIO_HOST_URL)%'

    # Each model referenced by an agent MUST be registered here under the EXACT
    # name sent to LM Studio (the value of APP_AI_TAG_MODEL / APP_AI_SUMMARY_MODEL).
    # The catalog does an exact key match — a quantization suffix like "@q4_k_m"
    # would NOT match a request for the base name and yields
    # "No provider found for model ...". If you switch models, add the new name here.
    model:
        lmstudio:
            'qwen3-vl-8b-instruct':
                class: 'Symfony\AI\Platform\Bridge\Generic\CompletionsModel'
                capabilities:
                    - input-messages
                    - input-image
                    - output-text
                    - output-streaming
                    - output-structured
    agent:
        tagger:
            platform: 'ai.platform.lmstudio'
            model: '%env(APP_AI_TAG_MODEL)%'
            prompt: |
                You classify web pages into 3 to 5 short lowercase tags (single words or hyphenated).
                Answer strictly as a JSON array of strings. No prose, no code fences.
                Example: ["php","web-dev","tutorial"]

        summarizer:
            platform: 'ai.platform.lmstudio'
            model: '%env(APP_AI_SUMMARY_MODEL)%'
            prompt: 'Summarize the given article concisely. The output language is set by the caller.'

        organizer_proposer:
            platform: 'ai.platform.lmstudio'
            model: '%env(APP_AI_TAG_MODEL)%'
            prompt: |
                You reorganize a messy bookmark folder into coherent sub-folders.
                You receive a numbered list of bookmarks ("#<id> <title>").
                Propose between 3 and 12 sub-folders that partition them by topic.
                For each sub-folder give: a short name (same language as the titles),
                a one-sentence description, and 2 to 3 example titles taken verbatim
                from the list. Every bookmark should plausibly fit one sub-folder.
                Answer strictly as JSON matching the provided schema. No prose, no code fences.

        organizer_assigner:
            platform: 'ai.platform.lmstudio'
            model: '%env(APP_AI_TAG_MODEL)%'
            prompt: |
                You assign bookmarks to a single target sub-folder.
                You receive the target folder (name + description) and a numbered list
                of bookmarks ("#<id> <title>"). Return the ids of the bookmarks that
                belong in that folder. Use only ids that appear in the list; omit the rest.
                Answer strictly as JSON matching the provided schema. No prose, no code fences.
