ai:
    platform:
        lmstudio:
            host_url: '%env(LM_STUDIO_HOST_URL)%'

    # Each model referenced by an agent MUST be registered here under the EXACT
    # name sent to LM Studio (the value of APP_AI_TAG_MODEL / APP_AI_SUMMARY_MODEL).
    # The catalog does an exact key match — a quantization suffix like "@q4_k_m"
    # would NOT match a request for the base name and yields
    # "No provider found for model ...". If you switch models, add the new name here.
    model:
        lmstudio:
            'qwen3-vl-8b-instruct':
                class: 'Symfony\AI\Platform\Bridge\Generic\CompletionsModel'
                capabilities:
                    - input-messages
                    - input-image
                    - output-text
                    - output-streaming
                    - output-structured
    agent:
        tagger:
            platform: 'ai.platform.lmstudio'
            model: '%env(APP_AI_TAG_MODEL)%'
            prompt: |
                You classify web pages into 3 to 5 short lowercase tags (single words or hyphenated).
                Answer strictly as a JSON array of strings. No prose, no code fences.
                Example: ["php","web-dev","tutorial"]

        summarizer:
            platform: 'ai.platform.lmstudio'
            model: '%env(APP_AI_SUMMARY_MODEL)%'
            prompt: 'Summarize the given article concisely. The output language is set by the caller.'

        organizer_proposer:
            platform: 'ai.platform.lmstudio'
            model: '%env(APP_AI_TAG_MODEL)%'
            prompt: |
                You are a taxonomist reorganizing a messy bookmark folder.
                You receive a numbered list of bookmarks ("#<id> <title>").
                Design 5 to 6 sub-folders that form a clean partition: mutually exclusive
                (no bookmark could reasonably fit two) and collectively exhaustive (every
                bookmark has an obvious home). Prefer folders of comparable size; do NOT create
                a "Misc"/"Other" catch-all unless a handful of items truly share nothing.
                Derive the folders from the actual content — never from a generic template.
                For each: a short scannable name in the language of the titles, a one-sentence
                description of its boundary (what belongs vs. what doesn't), and 2 example
                titles copied verbatim from the list.
                Answer strictly as JSON matching the provided schema. No prose, no code fences.

        organizer_assigner:
            platform: 'ai.platform.lmstudio'
            model: '%env(APP_AI_TAG_MODEL)%'
            prompt: |
                You assign bookmarks to a single target sub-folder, with strict precision.
                You receive the target folder (name + description) and a numbered list of
                bookmarks ("#<id> <title>"). Return the ids of the bookmarks that clearly and
                PRIMARILY belong in this folder — judged from concrete signals in the title
                (technology, domain, named entity) that match the folder's name and boundary
                description. When a bookmark only vaguely relates, or could fit several folders,
                OMIT it. Better to leave a link out than to misfile it. Use only ids that appear
                in the list.
                Answer strictly as JSON matching the provided schema. No prose, no code fences.
