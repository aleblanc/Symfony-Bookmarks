<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Symfony Bookmarks</title>
  <style>
    :root {
      --fg:#241a12; --muted:#7c6a58; --line:#e7ddcf; --card:#fff;
      --bg:#fbf7f0; --accent:#e11d48; --accent-weak:#fff1f3; --ok:#059669;
    }
    @media (prefers-color-scheme: dark) {
      :root { --fg:#efe7db; --muted:#a99a86; --line:#3a2f25; --card:#241c14;
        --bg:#1a140e; --accent:#fb7185; --accent-weak:#2a1620; }
    }
    * { box-sizing:border-box; }
    html,body { margin:0; }
    body { font:15px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
      color:var(--fg); background:var(--bg); }
    header { position:sticky; top:0; z-index:5; background:var(--bg);
      padding:12px 14px 8px; border-bottom:1px solid var(--line); }
    .row { display:flex; gap:8px; align-items:center; }
    h1 { font-size:16px; margin:0; flex:1; display:flex; align-items:center; gap:6px; }
    .searchrow { display:flex; gap:8px; margin-top:8px; }
    #q { flex:1; min-width:0; padding:11px 12px; font:inherit;
      border:1px solid var(--line); border-radius:10px; background:var(--card); color:var(--fg); }
    #q:focus { outline:2px solid var(--accent); border-color:var(--accent); }
    #gbtn { flex:none; display:flex; align-items:center; gap:5px; padding:0 12px;
      border:1px solid var(--line); border-radius:10px; background:var(--card);
      color:var(--fg); font:inherit; font-weight:600; cursor:pointer; white-space:nowrap; }
    #gbtn:active { background:var(--accent-weak); }
    .iconbtn { border:1px solid var(--line); background:var(--card); color:var(--fg);
      border-radius:9px; padding:8px 10px; font-size:15px; cursor:pointer; line-height:1; }
    .iconbtn:active { background:var(--accent-weak); }
    .meta { color:var(--muted); font-size:12px; padding:4px 14px 0; }
    .banner { margin:8px 14px 0; padding:8px 10px; border-radius:9px; font-size:12.5px;
      background:var(--accent-weak); color:var(--accent); }
    main { padding:8px 10px 40px; max-width:820px; margin:0 auto; }
    details { border:1px solid var(--line); border-radius:11px; background:var(--card);
      margin:8px 4px; overflow:hidden; }
    details[open] > summary { border-bottom:1px solid var(--line); }
    summary { cursor:pointer; padding:11px 12px; font-weight:600; list-style:none;
      display:flex; align-items:center; gap:8px; }
    summary::-webkit-details-marker { display:none; }
    summary .count { color:var(--muted); font-weight:400; font-size:12px; margin-left:auto; }
    .dash { font-size:13px; text-transform:uppercase; letter-spacing:.04em;
      color:var(--muted); margin:16px 8px 2px; font-weight:700; }
    .kids { padding-left:10px; }
    a.link { display:block; text-decoration:none; color:var(--fg);
      padding:9px 12px; border-top:1px solid var(--line); }
    a.link:first-child { border-top:0; }
    a.link:active { background:var(--accent-weak); }
    a.link .name { display:block; font-weight:500; }
    a.link .sub { display:block; color:var(--muted); font-size:12px;
      white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
    /* home sections as horizontal, swipable strips (~3 cards visible) */
    .section { margin:14px 6px; }
    .section h2 { font-size:12.5px; margin:0 0 8px; display:flex; align-items:center; gap:8px;
      text-transform:uppercase; letter-spacing:.03em; color:var(--muted); font-weight:700; }
    .section h2 .scount { font-weight:400; }
    .strip { display:flex; gap:8px; overflow-x:auto; scroll-snap-type:x mandatory;
      padding-bottom:6px; -webkit-overflow-scrolling:touch; }
    .strip::-webkit-scrollbar { height:6px; }
    .strip::-webkit-scrollbar-thumb { background:var(--line); border-radius:6px; }
    .card { flex:0 0 calc((100% - 16px) / 3); max-width:240px; scroll-snap-align:start;
      min-width:0; display:flex; flex-direction:column; gap:5px; padding:10px;
      text-decoration:none; color:var(--fg); background:var(--card);
      border:1px solid var(--line); border-radius:11px; }
    .card:active { background:var(--accent-weak); }
    .card .cname { font-weight:600; font-size:13px; line-height:1.25;
      display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; overflow:hidden; }
    .card .chost { color:var(--muted); font-size:11.5px; white-space:nowrap;
      overflow:hidden; text-overflow:ellipsis; }
    .empty { color:var(--muted); text-align:center; padding:40px 16px; }
    .setup { max-width:420px; margin:60px auto; text-align:center; padding:0 16px; }
    .setup button { margin-top:14px; padding:11px 16px; border-radius:10px;
      border:1px solid var(--accent); background:var(--accent); color:#fff; font:inherit;
      font-weight:700; cursor:pointer; }
    .fav { width:16px; height:16px; flex:none; }
  </style>
</head>
<body>
  <header>
    <div class="row">
      <h1 data-i18n="dash.heading">📚 Bookmarks</h1>
      <button id="save" class="iconbtn" data-i18n-title="dash.saveTitle" title="Save current page" type="button">➕</button>
      <button id="refresh" class="iconbtn" data-i18n-title="dash.refreshTitle" title="Refresh" type="button">⟳</button>
      <button id="opts" class="iconbtn" data-i18n-title="dash.settingsTitle" title="Settings" type="button">⚙️</button>
    </div>
    <div class="searchrow">
      <input id="q" type="search" data-i18n-ph="dash.searchPlaceholder" placeholder="Search bookmarks…" autocomplete="off" autocapitalize="off" spellcheck="false" autofocus>
      <button id="gbtn" type="button" data-i18n-title="dash.googleTitle" title="Search Google">🔍 Google</button>
    </div>
  </header>
  <p class="meta" id="meta">—</p>
  <div id="banner" class="banner" hidden></div>
  <main id="out"></main>

  <script src="lib/api.js"></script>
  <script src="lib/i18n.js"></script>
  <script src="lib/store.js"></script>
  <script src="dashboard.js"></script>
</body>
</html>
