<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Symfony Bookmarks Sync</title>
  <style>
    :root { --fg:#241a12; --muted:#7c6a58; --line:#e7ddcf; --accent:#e11d48; --ok:#059669; }
    * { box-sizing:border-box; }
    body { margin:0; width:270px; font:14px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
      color:var(--fg); background:#fbf7f0; padding:14px; }
    h1 { font-size:15px; margin:0 0 10px; }
    button { width:100%; padding:10px; border-radius:8px; border:1px solid var(--accent);
      background:var(--accent); color:#fff; font:inherit; font-weight:700; cursor:pointer; margin-bottom:8px; }
    button.secondary { background:#fff; color:var(--fg); border-color:var(--line); }
    button:disabled { opacity:.5; cursor:default; }
    .meta { color:var(--muted); font-size:12px; margin:8px 0 0; }
    #msg { margin-top:8px; font-size:12.5px; white-space:pre-wrap; }
    #msg.ok { color:var(--ok); } #msg.err { color:var(--accent); }
    .notice { background:#fff1f3; color:var(--accent); border-radius:8px; padding:10px; font-size:12.5px; margin-bottom:8px; }
    a { color:var(--accent); font-size:12px; }
  </style>
</head>
<body>
  <h1>Symfony Bookmarks Sync</h1>

  <div id="unavailable" class="notice" hidden>
    Native bookmark sync needs the bookmarks API, which Firefox for Android does
    not provide. Use Firefox on desktop for sync.
  </div>

  <button id="pull" type="button">⬇️ Receive (pull)</button>
  <button id="push" class="secondary" type="button">⬆️ Send (push)</button>

  <p class="meta" id="last">—</p>
  <p id="msg"></p>
  <p><a id="opts" href="#">Open settings</a></p>

  <script src="popup.js"></script>
</body>
</html>
