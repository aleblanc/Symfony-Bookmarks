<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Symfony Bookmarks — Review changes</title>
  <style>
    :root { --fg:#241a12; --muted:#7c6a58; --line:#e7ddcf; --accent:#e11d48;
      --ok:#059669; --amber:#d97706; --indigo:#6366f1; }
    * { box-sizing: border-box; }
    body { margin:0; font:15px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
      color:var(--fg); background:#fbf7f0; padding:24px; max-width:760px; }
    h1 { font-size:20px; margin:0 0 4px; }
    p.sub { color:var(--muted); margin:0 0 18px; }
    .bar { display:flex; gap:10px; align-items:center; flex-wrap:wrap; margin:14px 0 20px; }
    button { padding:9px 15px; border-radius:8px; border:1px solid var(--line);
      background:#fff; font:inherit; font-weight:600; cursor:pointer; }
    button.primary { background:var(--accent); border-color:var(--accent); color:#fff; }
    button:disabled { opacity:.55; cursor:default; }
    .group { border:1px solid var(--line); border-radius:12px; background:#fff;
      margin-bottom:16px; overflow:hidden; }
    .group > h2 { font-size:14px; margin:0; padding:11px 14px; background:#f6efe3;
      border-bottom:1px solid var(--line); display:flex; align-items:center; gap:8px; }
    .group ul { list-style:none; margin:0; padding:0; }
    .group li { display:flex; gap:10px; align-items:flex-start; padding:9px 14px;
      border-top:1px solid #f1eae0; }
    .group li:first-child { border-top:0; }
    .group li input { margin-top:3px; }
    .it-title { font-weight:600; }
    .it-url { color:var(--muted); font-size:12.5px; word-break:break-all; }
    .it-note { color:var(--amber); font-size:12px; }
    .empty { color:var(--muted); padding:12px 14px; }
    #summary { margin-top:8px; font-size:14px; }
    #summary.ok { color:var(--ok); } #summary.err { color:var(--accent); }
    .count { color:var(--muted); font-weight:400; }
    .notice { background:#fff1f3; color:var(--accent); border-radius:10px; padding:14px; }
  </style>
</head>
<body>
  <h1>⬇️ Receive from Symfony Bookmarks</h1>
  <p class="sub">Review the changes to apply to your Firefox bookmarks. Untick anything you want to skip.</p>

  <div id="loading" class="sub">Computing changes…</div>
  <div id="unavailable" class="notice" hidden></div>

  <div id="plan" hidden>
    <div class="group" data-group="adds">
      <h2>➕ To add <span class="count" data-count></span></h2>
      <ul></ul>
    </div>
    <div class="group" data-group="updates">
      <h2>✏️ To update <span class="count" data-count></span></h2>
      <ul></ul>
    </div>
    <div class="group" data-group="deletes">
      <h2>🗑️ To remove from Firefox <span class="count" data-count></span></h2>
      <ul></ul>
    </div>

    <div class="bar">
      <button id="all" type="button">Tick all</button>
      <button id="none" type="button">Untick all</button>
      <button id="apply" class="primary" type="button">Apply selection</button>
    </div>
    <div id="summary"></div>
  </div>

  <script src="lib/api.js"></script>
  <script src="lib/sync.js"></script>
  <script src="review.js"></script>
</body>
</html>
